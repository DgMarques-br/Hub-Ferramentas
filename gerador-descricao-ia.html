<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IA</title>
<link rel="icon" type="image/png" href="img/Logotipo.png">
<style>
  :root{
    --bg: #EEF0EF; --paper: #FFFFFF; --ink: #17211D; --ink-soft: #576159;
    --line: #DADFDA; --line-soft: #E7EAE6; --teal: #1F6F5C;
    --plum: #5B4B8A; --plum-wash: #ECE8F5; --radius: 10px;
    --mono: ui-monospace, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --serif: Georgia, serif;
  }
  :root[data-theme="dark"]{
    --bg: #11201B; --paper: #16231E; --ink: #E8EEEC; --ink-soft: #92A49C;
    --line: #233830; --line-soft: #1D2D27; --plum: #C2B0EC; --plum-wash: #2B2440;
  }
  *{ box-sizing: border-box; }
  body{ background: var(--bg); color: var(--ink); font-family: var(--sans); min-height: 100vh; margin:0; padding:0; transition: background .15s, color .15s; }
  header.top{ background: var(--paper); border-bottom: 1px solid var(--line); }
  .top-inner{ max-width: 1180px; margin: 0 auto; padding: 28px 24px 22px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 24px; }
  .nav-back { display: inline-block; font-size: 13px; font-weight: 600; color: var(--ink-soft); text-decoration: none; margin-bottom: 16px; }
  .brand-eyebrow{ font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--plum); font-weight: 600; margin: 0 0 6px; }
  h1{ font-family: var(--serif); font-size: 34px; margin: 0 0 6px; }
  .subtitle{ margin:0; color: var(--ink-soft); font-size: 14.5px; }
  .theme-toggle{ border: 1.5px solid var(--line); background: var(--bg); color: var(--ink-soft); padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; }
  
  main { max-width: 1180px; margin: 0 auto; padding: 32px 24px 60px; }
  .split-view { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: start; }
  @media (max-width: 850px){ .split-view { grid-template-columns: 1fr; } }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; display: flex; flex-direction: column; }
  
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 8px; }
  input, textarea { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); font-family: var(--sans); }
  input:focus, textarea:focus { border-color: var(--plum); background: var(--paper); outline:none;}
  textarea { min-height: 140px; resize: vertical; }
  
  .actions { display: flex; gap: 12px; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line-soft); flex-wrap: wrap;}
  .btn-primary { flex: 1; padding: 12px 20px; background-color: var(--plum); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; min-width: 150px;}
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary { flex: 1; padding: 12px 20px; background: transparent; color: var(--ink); border: 1.5px solid var(--line); border-radius: 8px; cursor: pointer; font-weight: 600; min-width: 150px;}
  
  .tabs { display: flex; gap: 16px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  .tab-btn { background: none; border: none; padding: 0 0 10px 0; font-size: 14px; font-weight: 600; color: var(--ink-soft); cursor: pointer; border-bottom: 2px solid transparent; }
  .tab-btn.active { color: var(--plum); border-bottom-color: var(--plum); }
  .tab-content { display: none; flex-grow: 1; flex-direction: column; }
  .tab-content.active { display: flex; }
  
  #htmlOutput { font-family: var(--mono); font-size: 13px; color: var(--ink-soft); min-height: 450px; }
  .preview-box { border: 1.5px solid var(--line); border-radius: 8px; padding: 20px; background: var(--paper); min-height: 450px; }
  
  .sources-box { margin-top: 16px; padding: 14px; background: var(--plum-wash); border-radius: 8px; }
  .sources-title { font-size: 13px; font-weight: 700; color: var(--plum); margin-bottom: 6px; }
  .sources-list { margin: 0; padding-left: 20px; font-size: 12px; color: var(--ink-soft); }
  .sources-list a { color: var(--plum); text-decoration: none; font-weight: 600; }
  
  .toast{ position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #17211D; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13.5px; opacity: 0; transition: all .2s ease; z-index: 100; }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div>
      <a href="index.html" class="nav-back">← Voltar ao Hub</a>
      <p class="brand-eyebrow">Motor de Criação</p>
      <h1>Gerador de Descrições IA</h1>
      <p class="subtitle">Faça suas descrições com IA juntamente com a exportação ao Word!</p>
    </div>
    <div><button class="theme-toggle" id="themeToggle">🌙 Modo escuro</button></div>
  </div>
</header>

<main>
  <div class="split-view">
    <div class="card">
      <div class="form-group">
        <label>Chave API Groq</label>
        <input type="password" id="apiKeyGroq" placeholder="gsk_...">
      </div>
      <div class="form-group">
        <label>Chave API Tavily</label>
        <input type="password" id="apiKeyTavily" placeholder="tvly-...">
      </div>
      <div class="form-group">
        <label>Nome do Produto / Modelo</label>
        <input type="text" id="tituloInput" placeholder="Ex: Placa Mãe Gigabyte Z790 Aero G AX">
      </div>
      <div class="form-group" style="flex-grow: 1; display: flex; flex-direction: column;">
        <label>Instruções Manuais / Forçar Dados (Opcional)</label>
        <textarea id="rawInfoInput" placeholder="Ex: 'EAN: 8713439233804. NAC011068.'"></textarea>
      </div>
      <div class="actions">
        <button type="button" class="btn-primary" id="btnGerar" onclick="executarAutomacao()">✨ Pesquisar na Web e Gerar</button>
      </div>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('html')">&lt;/&gt; HTML</button>
        <button class="tab-btn" onclick="switchTab('preview')">👁️ Visualização</button>
      </div>
      
      <div id="tab-html" class="tab-content active">
        <textarea id="htmlOutput" readonly placeholder="A descrição formatada em HTML aparecerá aqui..."></textarea>
      </div>
      <div id="tab-preview" class="tab-content">
        <div class="preview-box" id="previewOutput">Aguardando geração...</div>
      </div>
      
      <div class="sources-box" id="sourcesBox" style="display:none;">
        <div class="sources-title">Fontes Consultadas:</div>
        <ul class="sources-list" id="sourcesList"></ul>
      </div>

      <div class="actions">
        <button class="btn-secondary" onclick="copiarTexto('htmlOutput', 'HTML')">📋 Copiar HTML</button>
        <button class="btn-secondary" onclick="copiarRenderizado()">📝 Copiar Texto</button>
        <button class="btn-primary" style="background: #2B579A; min-width: 100%;" onclick="exportarParaWord()">📄 Exportar para Word (.doc)</button>
      </div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const themeToggleBtn = document.getElementById('themeToggle');
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  themeToggleBtn.textContent = theme === 'dark' ? '☀️ Modo claro' : '🌙 Modo escuro';
}
applyTheme(localStorage.getItem('sapCatalogTheme') || 'dark');
themeToggleBtn.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  localStorage.setItem('sapCatalogTheme', next);
});

const keyGroq = document.getElementById('apiKeyGroq');
const keyTavily = document.getElementById('apiKeyTavily');
keyGroq.value = localStorage.getItem('groq_api_key') || '';
keyTavily.value = localStorage.getItem('tavily_api_key') || '';
keyGroq.addEventListener('input', () => localStorage.setItem('groq_api_key', keyGroq.value.trim()));
keyTavily.addEventListener('input', () => localStorage.setItem('tavily_api_key', keyTavily.value.trim()));

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg; toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  if(tab === 'html') {
    document.querySelectorAll('.tab-btn')[0].classList.add('active');
    document.getElementById('tab-html').classList.add('active');
  } else {
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
    document.getElementById('tab-preview').classList.add('active');
  }
}

async function executarAutomacao() {
  const groqKey = keyGroq.value.trim(); const tavilyKey = keyTavily.value.trim();
  const titulo = document.getElementById('tituloInput').value.trim();
  const instrucoes = document.getElementById('rawInfoInput').value.trim();
  const btn = document.getElementById('btnGerar');
  const sourcesBox = document.getElementById('sourcesBox'); const sourcesList = document.getElementById('sourcesList');

  if (!groqKey || !tavilyKey || !titulo) { alert("Preencha as chaves e o título."); return; }
  btn.disabled = true; sourcesBox.style.display = 'none'; sourcesList.innerHTML = '';

  try {
    let regrasExternas = "";
    try {
      const resRegras = await fetch('PADRÃO-DE-DESCRIÇÃO.txt');
      if(resRegras.ok) regrasExternas = await resRegras.text();
    } catch(err) { console.warn("Aviso: TXT não encontrado."); }

    // ---------- BUSCA CONFIÁVEL ----------
    const DOMINIOS_RUINS = ['pinterest.com','youtube.com','facebook.com','instagram.com','tiktok.com','reddit.com','quora.com','olx.com.br'];
    const LOJAS = ['kabum.com.br','pichau.com.br','terabyteshop.com.br','mercadolivre.com.br','amazon.com.br','magazineluiza.com.br','fastshop.com.br','casasbahia.com.br','carrefour.com.br','americanas.com.br','techpowerup.com','notebookcheck.net','gsmarena.com','rtings.com'];
    const STOP = new Set(['para','com','sem','placa','mae','gamer','gaming','preto','branco','iluminado','fio','kit','conjunto','mouse','teclado','headset','fone','cabo','fonte','memoria','monitor']);
    const norm = t => (t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

    const queryLimpa = titulo.replace(/para PC|Iluminado|Preto|Branco|Com Fio/gi, '').replace(/\s+/g, ' ').trim();
    const ean = (instrucoes.match(/\b\d{13}\b/) || [])[0];
    const palavras = norm(queryLimpa).split(/[^a-z0-9]+/).filter(w => w.length >= 4 && !STOP.has(w));
    const comDigito = norm(queryLimpa).split(/[^a-z0-9]+/).filter(w => w.length >= 3 && /\d/.test(w));
    const tokensModelo = [...new Set(comDigito.length ? comDigito : palavras)];

    const buscar = async (query, profundidade) => {
      const body = { api_key: tavilyKey, query, search_depth: profundidade, max_results: 6, include_answer: false, include_raw_content: true, exclude_domains: DOMINIOS_RUINS };
      if (profundidade === 'advanced') body.chunks_per_source = 3;
      const r = await fetch('https://api.tavily.com/search', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail?.error || d.message || 'Erro Tavily');
      return d.results || [];
    };

    btn.textContent = "🔍 A pesquisar na web...";
    const consultas = [
      buscar(`${queryLimpa} ficha técnica especificações`, 'advanced'),
      buscar(`${queryLimpa} dimensões peso altura largura comprimento embalagem`, 'advanced')
    ];
    if (ean) consultas.push(buscar(ean, 'basic'));
    const resp = await Promise.allSettled(consultas);
    const ok = resp.filter(r => r.status === 'fulfilled');
    if (!ok.length) throw resp[0].reason;

    const extrairMedidas = txt => {
      const re = /(altura|largura|profundidade|comprimento|dimens[õo]es|medidas|peso|height|width|depth|length|weight|dimensions)/i;
      const vistos = new Set(); const out = [];
      (txt || '').split(/\n|(?<=[.;|])\s+/).forEach(l => {
        l = l.replace(/\s+/g, ' ').trim();
        if (l.length < 4 || l.length > 220 || !re.test(l) || !/\d/.test(l) || vistos.has(l)) return;
        vistos.add(l); out.push(l);
      });
      return out.slice(0, 8);
    };

    const mapa = new Map();
    ok.flatMap(r => r.value).forEach(r => {
      if (!r.url) return;
      const k = r.url.split('#')[0]; const ant = mapa.get(k);
      if (!ant) mapa.set(k, r);
      else mapa.set(k, { ...((r.score || 0) > (ant.score || 0) ? r : ant), raw_content: r.raw_content || ant.raw_content });
    });

    const analisados = [...mapa.values()].map(r => {
      let host = ''; try { host = new URL(r.url).hostname.replace(/^www\./, ''); } catch (e) {}
      const labels = host.split('.').filter(l => !['com', 'br', 'net', 'org', 'co'].includes(l));
      const oficial = labels.some(l => l.length >= 4 && palavras.includes(l));
      const loja = LOJAS.some(d => host === d || host.endsWith('.' + d));
      const texto = norm(`${r.title} ${r.url} ${r.content} ${(r.raw_content || '').slice(0, 3000)}`);
      const match = tokensModelo.length ? tokensModelo.filter(t => texto.includes(t)).length / tokensModelo.length : 1;
      const trechos = extrairMedidas(r.raw_content || r.content);
      const rank = (r.score || 0) + (oficial ? 0.35 : 0) + (loja ? 0.15 : 0) + (trechos.length ? 0.1 : 0);
      return { ...r, host, oficial, loja, match, trechos, rank };
    });

    let validos = analisados.filter(r => r.match >= 0.6);
    const semMatch = validos.length === 0;
    if (semMatch) validos = analisados;
    const top = validos.sort((a, b) => b.rank - a.rank).slice(0, 5);

    let contextoWeb = "";
    const linksUteis = top.map(r => ({ title: r.title || r.url, url: r.url, host: r.host, oficial: r.oficial, loja: r.loja, medidas: r.trechos.length > 0 }));
    top.forEach((r, i) => {
      const tipo = r.oficial ? 'SITE OFICIAL DO FABRICANTE' : r.loja ? 'LOJA CONHECIDA' : 'OUTRO SITE';
      contextoWeb += `[FONTE ${i + 1} | ${tipo} | ${r.host}]\nTítulo: ${r.title}\nConteúdo: ${(r.content || '').slice(0, 1500)}\n`;
      if (r.trechos.length) contextoWeb += `Trechos com medidas/peso:\n- ${r.trechos.join('\n- ')}\n`;
      contextoWeb += '\n';
    });
    if (contextoWeb.length > 9000) contextoWeb = contextoWeb.substring(0, 9000) + "\n\n[... TEXTO CORTADO ...]";
    if (!top.length) contextoWeb = "(nenhuma fonte encontrada)";
    if (semMatch && top.length) showToast("⚠️ Nenhuma fonte citou o modelo exato. Confira os dados.");

    btn.textContent = "✨ A formatar com Groq...";
    const promptGroq = `
Você é um especialista rigoroso na criação de descrições para e-commerce.

REGRAS DE NEGÓCIO OBRIGATÓRIAS:
Leia e aplique CADA UMA das regras abaixo com atenção meticulosa.
=========================================
${regrasExternas}
=========================================

INSTRUÇÕES CRÍTICAS DE DESIGN E AGRUPAMENTO:
1. Agrupe todos os itens da mesma secção dentro da mesma tag span, saltando linha apenas com a tag <br>. Não abra e feche spans a cada linha!
2. NUNCA OMita a secção ITENS INCLUSOS.
3. DIMENSÕES E FORMATO: Para hardwares, o 'Formato' (ex: ATX) DEVE ser listado na secção ESPECIFICAÇÕES. Na secção DIMENSÕES, use os 'Trechos com medidas/peso' das fontes (em cm e Kg; converta mm para cm e g para Kg). Se a fonte distinguir medidas do produto e da embalagem, siga as REGRAS DE NEGÓCIO acima; se elas não disserem nada, use as do produto.
4. EAN, Anatel e NAC: Para EAN e Anatel, só o rótulo é negrito. Para o NAC, TODO o texto e números são negrito (<strong>NAC000000</strong>). Não adicione quebras de linha extras antes do NAC.
5. FONTES DE PESQUISA: cada fonte vem marcada (SITE OFICIAL, LOJA CONHECIDA ou OUTRO SITE). Em caso de valores diferentes, prevaleça SITE OFICIAL, depois LOJA CONHECIDA. Só use OUTRO SITE se for coerente com as demais.
6. ESCUDO ANTI-ALUCINAÇÃO: se uma fonte tratar de OUTRO produto ou modelo, ignore ESSA fonte. NUNCA invente valores: se Altura, Largura, Comprimento, Peso ou qualquer especificação não aparecer em nenhuma fonte, escreva VERIFICAR no lugar do valor (sem a unidade).

MOLDE OBRIGATÓRIO DE SAÍDA (HTML):
Siga EXATAMENTE esta estrutura:

<span style="font-size:14px;"><strong>[TÍTULO DO PRODUTO EM TITLE CASE]</strong></span><br><br>
<span style="font-size:12px;">
[Parágrafo único comercial e objetivo sobre o produto]
</span><br><br>
<span style="font-size:14px;"><strong>ESPECIFICAÇÕES</strong></span><br><br>
<span style="font-size:12px;">
<strong>[Chave 1]:</strong> [Valor 1]<br>
<strong>[Chave 2]:</strong> [Valor 2]<br>
(Liste todas as outras aqui, seguidas de <br>)
</span><br><br>
<span style="font-size:12px;"><strong>DIMENSÕES</strong></span><br>
<span style="font-size:12px;">
<strong>Altura: </strong> [Valor] cm<br>
<strong>Largura: </strong> [Valor] cm<br>
<strong>Comprimento: </strong> [Valor] cm<br>
<strong>Peso: </strong> [Valor] Kg
</span><br><br>
<span style="font-size:12px;"><strong>ITENS INCLUSOS</strong></span><br>
<span style="font-size:12px;">
[Qtd] [Item]<br>
(Mais itens se houver)
</span><br><br>
<span style="font-size:12px;">
Imagens de caráter ilustrativo.<br>
Informações divulgadas de acordo com o manual do fabricante.<br>
Produto novo na caixa, lacrado, com nota fiscal e garantia do fabricante de [PRAZO].<br>
Em caso de dúvidas sobre informações técnicas, consulte o manual do fabricante.<br><br>
<strong>EAN:</strong> [Valor]<br> [caso o valor não seja informado pelo usuario, não acrescentar no resultado final]
<strong>Anatel:</strong> [Valor]<br>[caso o valor não seja informado pelo usuario, não acrescentar no resultado final]
<strong>NAC000000</strong> [caso o valor não seja informado pelo usuario, não acrescentar no resultado final]
</span>

DADOS DO PRODUTO:
Nome: ${titulo}
Instruções extras do usuário: ${instrucoes}

INFORMAÇÕES RECOLHIDAS DA WEB:
${contextoWeb}
`;

    const groqRes = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${groqKey}` },
      body: JSON.stringify({
        model: 'openai/gpt-oss-120b',
        messages: [{ role: 'user', content: promptGroq }],
        temperature: 0.1
      })
    });

    const groqData = await groqRes.json();
    if (groqData.error) throw new Error(groqData.error.message || "Erro Groq");

    if (groqData.choices && groqData.choices[0]?.message?.content) {
      let htmlGerado = groqData.choices[0].message.content;
      htmlGerado = htmlGerado.replace(/```html/g, '').replace(/```/g, '').trim();

      document.getElementById('htmlOutput').value = htmlGerado;
      document.getElementById('previewOutput').innerHTML = htmlGerado;

      if (linksUteis.length > 0) {
        linksUteis.forEach(item => {
          const li = document.createElement('li');
          const a = document.createElement('a'); a.href = item.url; a.target = "_blank"; a.textContent = item.title;
          const tag = document.createElement('span'); tag.textContent = ' — ' + item.host + (item.oficial ? ' · 🏭 oficial' : item.loja ? ' · 🛒 loja' : '') + (item.medidas ? ' · 📏 medidas' : '');
          li.appendChild(a); li.appendChild(tag); sourcesList.appendChild(li);
        });
        sourcesBox.style.display = 'block';
      }
      showToast(/VERIFICAR/.test(htmlGerado) ? "Gerado — há campos VERIFICAR (dado não encontrado)." : "Descrição gerada com sucesso!");
    }
  } catch (err) {
    alert("Erro no processo: " + err.message);
  } finally {
    btn.disabled = false; btn.textContent = "✨ Pesquisar na Web e Gerar";
  }
}

function copiarTexto(elId, label) {
  const el = document.getElementById(elId); if (!el.value) return;
  el.select(); document.execCommand('copy'); showToast(label + " copiado com sucesso!");
}

// ==========================================
// FUNÇÃO DE LIMPEZA EXTREMA
// ==========================================
function obterTextoPurissimo(html) {
  // 1. O PULO DO GATO: Remove as quebras de linha FÍSICAS ocultas no código da IA
  // Sem isso, a linha vazia dobrava a cada processamento.
  let txt = html.replace(/\r?\n/g, ''); 
  
  // 2. Converte apenas o que importa (o <br> da web) em quebras reais do sistema (\n)
  txt = txt.replace(/<br\s*[\/]?>/gi, '\n');
  
  // 3. Destrói absolutamente todas as outras tags de HTML (inclusive spans e negritos)
  txt = txt.replace(/<[^>]+>/g, '');
  
  // 4. Decodifica símbolos perdidos
  const ta = document.createElement('textarea');
  ta.innerHTML = txt;
  txt = ta.value;
  
  // 5. Remove espaços nas laterais de cada linha
  txt = txt.split('\n').map(l => l.trim()).join('\n');
  
  // 6. Garante que nunca existam espaços duplos
  txt = txt.replace(/\n{3,}/g, '\n\n');
  
  return txt.trim();
}

// ==========================================
// CÓPIA LIMPA (PERFEITA PARA MERCADO LIVRE)
// ==========================================
function copiarRenderizado() {
  const htmlContent = document.getElementById('htmlOutput').value;
  if(!htmlContent.trim()) { showToast('Nenhum texto para copiar.'); return; }
  
  let textoPuro = obterTextoPurissimo(htmlContent);

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(textoPuro).then(() => showToast('Texto copiado perfeitamente liso!'));
  } else {
    const ta = document.createElement('textarea'); ta.value = textoPuro;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); showToast('Texto copiado perfeitamente liso!');
  }
}

// ==========================================
// EXPORTAÇÃO WORD (ESPAÇAMENTO APERTADO, ZERO NEGRITO)
// ==========================================
function exportarParaWord() {
  const htmlContent = document.getElementById('htmlOutput').value;
  if(!htmlContent.trim()) { showToast('Nenhum conteúdo para exportar.'); return; }
  
  let tituloProduto = document.getElementById('tituloInput').value.trim() || 'Descricao_Produto';
  
  const nacMatch = htmlContent.match(/NAC\d+/i);
  let nacPrefixo = nacMatch ? nacMatch[0].toUpperCase() : 'NAC_ND';

  let nomeArquivo = `${nacPrefixo} - ${tituloProduto}`;
  nomeArquivo = nomeArquivo.replace(/[\\/:*?"<>|]/g, '').trim();

  let textoPuro = obterTextoPurissimo(htmlContent);

  // Cada linha de texto vira um parágrafo estrutural no Word com zero margens.
  let htmlParaWord = textoPuro.split('\n').map(linha => {
     return `<p style="margin:0; padding:0; font-family: Arial, sans-serif; font-size: 11pt;">${linha === '' ? '&nbsp;' : linha}</p>`;
  }).join('');

  const preHtml = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Export HTML To Doc</title></head><body>";
  const postHtml = "</body></html>";
  const htmlDoc = preHtml + htmlParaWord + postHtml;

  const blob = new Blob(['\ufeff', htmlDoc], { type: 'application/msword' });
  const url = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(htmlDoc);
  const downloadLink = document.createElement("a");
  document.body.appendChild(downloadLink);
  
  if (navigator.msSaveOrOpenBlob) { navigator.msSaveOrOpenBlob(blob, nomeArquivo + '.doc'); } 
  else { downloadLink.href = url; downloadLink.download = nomeArquivo + '.doc'; downloadLink.click(); }
  document.body.removeChild(downloadLink);
  showToast('Ficheiro Word exportado com espaçamento perfeito!');
}
</script>
