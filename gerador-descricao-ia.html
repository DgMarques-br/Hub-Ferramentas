<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Descrições com IA</title>
<style>
  :root{
    --bg: #EEF0EF;
    --paper: #FFFFFF;
    --ink: #17211D;
    --ink-soft: #576159;
    --line: #DADFDA;
    --line-soft: #E7EAE6;
    --teal: #1F6F5C;
    --teal-dark: #164F42;
    --teal-wash: #E4F0EC;
    --amber: #B9762D;
    --amber-wash: #F7ECDE;
    --plum: #5B4B8A;
    --plum-wash: #ECE8F5;
    --red: #D93025;
    --radius: 10px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
  }
  :root[data-theme="dark"]{
    --bg: #11201B;
    --paper: #16231E;
    --ink: #E8EEEC;
    --ink-soft: #92A49C;
    --line: #233830;
    --line-soft: #1D2D27;
    --teal: #3FB492;
    --teal-dark: #7FDDBE;
    --teal-wash: #1B3830;
    --plum: #C2B0EC;
    --plum-wash: #2B2440;
    --amber: #E3A95D;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    min-height: 100vh; -webkit-font-smoothing: antialiased;
    transition: background .15s ease, color .15s ease;
  }

  header.top{ background: var(--paper); border-bottom: 1px solid var(--line); }
  .top-inner{ max-width: 1180px; margin: 0 auto; padding: 28px 24px 22px; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .nav-back { display: inline-block; font-size: 13px; font-weight: 600; color: var(--ink-soft); text-decoration: none; margin-bottom: 16px; }
  .nav-back:hover { color: var(--plum); }
  .brand-eyebrow{ font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--plum); font-weight: 600; margin: 0 0 6px; }
  h1{ font-family: var(--serif); font-size: 34px; line-height: 1.1; margin: 0 0 6px; color: var(--ink); }
  .subtitle{ margin:0; color: var(--ink-soft); font-size: 14.5px; max-width: 520px; }

  .theme-toggle{ display: inline-flex; align-items: center; gap: 7px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink-soft); padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; }

  main { max-width: 1180px; margin: 0 auto; padding: 32px 24px 60px; }
  .split-view { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: start; }
  @media (max-width: 850px){ .split-view { grid-template-columns: 1fr; } }

  .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 13.5px; font-weight: 600; color: var(--ink); margin-bottom: 8px; }
  .form-group .hint { font-size: 12px; color: var(--ink-soft); margin-top: 4px; display: block; }

  input[type="text"], input[type="password"], textarea {
    width: 100%; padding: 12px 14px; border-radius: 8px; border: 1.5px solid var(--line);
    background: var(--bg); font-size: 14.5px; font-family: var(--sans); color: var(--ink); outline: none;
  }
  input:focus, textarea:focus { border-color: var(--plum); background: var(--paper); }
  textarea { resize: vertical; min-height: 120px; }

  .actions { display: flex; gap: 12px; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line-soft); }
  .btn-primary { flex: 1; padding: 12px 24px; font-size: 14.5px; background-color: var(--plum); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Tabs e Result */
  .tabs { display: flex; gap: 16px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  .tab-btn { background: none; border: none; padding: 0 0 10px 0; font-size: 14px; font-weight: 600; color: var(--ink-soft); cursor: pointer; border-bottom: 2px solid transparent; }
  .tab-btn.active { color: var(--plum); border-bottom-color: var(--plum); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  #htmlOutput { font-family: var(--mono); font-size: 13px; line-height: 1.5; color: var(--ink-soft); background: var(--bg); height: 500px; }
  .preview-box { border: 1.5px solid var(--line); border-radius: 8px; padding: 20px; background: var(--paper); min-height: 500px; font-family: Arial, sans-serif; }

  .toast{ position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #17211D; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: all .18s ease; z-index: 100; }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div>
      <a href="index.html" class="nav-back">← Voltar ao Hub</a>
      <p class="brand-eyebrow">Inteligência Artificial</p>
      <h1>Gerador de Descrições IA</h1>
      <p class="subtitle">Crie anúncios e especificações técnicas otimizadas automaticamente com a API do Google Gemini.</p>
    </div>
    <div>
      <button class="theme-toggle" id="themeToggle" type="button">🌙 Modo escuro</button>
    </div>
  </div>
</header>

<main>
  <div class="split-view">
    <!-- COLUNA 1: ENTRADA -->
    <div class="card">
      
      <!-- Chave de API -->
      <div class="form-group">
        <label for="apiKeyInput">Sua Chave API (Google AI Studio)</label>
        <input type="password" id="apiKeyInput" placeholder="Cole sua API Key aqui (AIzaSy...)">
        <span class="hint">A chave fica salva apenas no seu navegador (localStorage).</span>
      </div>

      <!-- Título do Produto -->
      <div class="form-group">
        <label for="tituloInput">Nome do Produto / Modelo</label>
        <input type="text" id="tituloInput" placeholder="Ex: Headset Gamer JBL Quantum 100 Preto">
      </div>

      <!-- Informações Brutas -->
      <div class="form-group">
        <label for="rawInfoInput">Dados Brutos / Ficha Técnica Curta</label>
        <textarea id="rawInfoInput" placeholder="Cole qualquer texto com dados técnicos ou recursos do fabricante...&#10;&#10;Exemplo: Conexão P2 3.5mm, driver 40mm, microfone removível, leve 220g, compatível com PC, Xbox, PS5 e Switch."></textarea>
      </div>

      <div class="actions">
        <button type="button" class="btn-primary" id="btnGerar" onclick="gerarComIA()">✨ Gerar Descrição com IA</button>
      </div>
    </div>

    <!-- COLUNA 2: SAÍDA -->
    <div class="card" style="display: flex; flex-direction: column;">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('html')">&lt;/&gt; Código HTML</button>
        <button class="tab-btn" onclick="switchTab('preview')">👁️ Visualização Real</button>
      </div>

      <div id="tab-html" class="tab-content active" style="flex-grow: 1;">
        <textarea id="htmlOutput" readonly placeholder="A descrição formatada em HTML aparecerá aqui..."></textarea>
      </div>
      <div id="tab-preview" class="tab-content" style="flex-grow: 1;">
        <div class="preview-box" id="previewOutput">
          <span style="color: var(--ink-soft); font-size: 14px;">Preencha os dados e clique em 'Gerar Descrição'.</span>
        </div>
      </div>

      <div class="actions" style="margin-top: auto;">
        <button type="button" class="btn-primary" onclick="copiarTexto('htmlOutput')">📋 Copiar HTML</button>
      </div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
// --- TEMA ---
const themeToggleBtn = document.getElementById('themeToggle');
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  themeToggleBtn.textContent = theme === 'dark' ? '☀️ Modo claro' : '🌙 Modo escuro';
}
const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
applyTheme(localStorage.getItem('sapCatalogTheme') || (prefersDark ? 'dark' : 'light'));
themeToggleBtn.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  localStorage.setItem('sapCatalogTheme', next);
});

// --- PERSISTÊNCIA DA CHAVE API ---
const apiKeyInput = document.getElementById('apiKeyInput');
apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
apiKeyInput.addEventListener('input', () => {
  localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
});

// --- TROCA DE TABS ---
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  if(tab === 'html') {
    document.querySelectorAll('.tab-btn')[0].classList.add('active');
    document.getElementById('tab-html').classList.add('active');
  } else {
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
    document.getElementById('tab-preview').classList.add('active');
  }
}

// --- INTEGRAÇÃO COM GEMINI API ---
async function gerarComIA() {
  const apiKey = apiKeyInput.value.trim();
  const titulo = document.getElementById('tituloInput').value.trim();
  const rawInfo = document.getElementById('rawInfoInput').value.trim();
  const btn = document.getElementById('btnGerar');

  if (!apiKey) {
    alert("Por favor, informe a sua API Key do Google AI Studio.");
    return;
  }
  if (!titulo) {
    alert("Por favor, informe pelo menos o nome do produto.");
    return;
  }

  btn.disabled = true;
  btn.textContent = "⏳ Gerando com IA...";

  const promptSystem = `
Você é um especialista em e-commerce e redação técnica de produtos para marketplaces (Mercado Livre, Magalu, Amazon).
Sua tarefa é gerar uma descrição profissional em HTML limpo baseada nas informações do produto fornecidas.

REGRAS RÍGIDAS DE FORMATAÇÃO HTML:
1. Retorne APENAS o código HTML, sem blocos de código markdown (não use \`\`\`html ou \`\`\`).
2. Utilize exatamente a estrutura abaixo:

<span style="font-size:14px;"><strong>[TÍTULO DO PRODUTO EM TITLE CASE]</strong></span><br><br>
<span style="font-size:12px;">
[Texto descritivo e comercial envolvente de 2 a 3 parágrafos curtos explicando os benefícios do produto, usando quebras de linha <br>]
</span><br>
<span style="font-size:14px;"><strong>ESPECIFICAÇÕES</strong></span><br>
<span style="font-size:12px;">
<strong>Chave 1:</strong> Valor 1<br>
<strong>Chave 2:</strong> Valor 2<br>
</span><br>
<span style="font-size:14px;"><strong>ITENS INCLUSOS</strong></span><br>
<span style="font-size:12px;">
1x Item A<br>
1x Item B<br>
</span><br>
<span style="font-size:12px;">
Imagens de caráter ilustrativo.<br>
Informações divulgadas de acordo com o manual do fabricante.<br>
Produto novo na caixa, lacrado com NF e garantia do fabricante.<br>
Em caso de dúvidas sobre informações técnicas, utilização, limitações e manuseio do produto, verifique o manual do fabricante.<br>
</span>

DADOS DO PRODUTO FORNECIDOS:
Nome: ${titulo}
Informações/Especificações Brutas: ${rawInfo}
`;

  // Lista atualizada com os modelos mais recentes sugeridos pela API
  const modelos = [
    'gemini-3.8-flash',
    'gemini-3.1-pro-preview'
  ];

  let sucesso = false;
  let ultimoErro = "";

  for (const modelo of modelos) {
    btn.textContent = `⏳ Gerando (${modelo})...`;
    
    for (let tentativa = 1; tentativa <= 2; tentativa++) {
      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${apiKey}`;
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptSystem }] }]
          })
        });

        const data = await response.json();

        if (data.error) {
          if (data.error.code === 503 || (data.error.message && data.error.message.includes("high demand"))) {
            ultimoErro = `Modelo ${modelo} sobrecarregado.`;
            await new Promise(res => setTimeout(res, 2000 * tentativa));
            continue;
          }
          throw new Error(data.error.message || "Erro na API do Google");
        }

        if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
          let htmlGerado = data.candidates[0].content.parts[0].text;
          
          htmlGerado = htmlGerado.replace(/```html/g, '').replace(/```/g, '').trim();

          document.getElementById('htmlOutput').value = htmlGerado;
          document.getElementById('previewOutput').innerHTML = htmlGerado;
          showToast(`Descrição gerada com sucesso (${modelo})!`);
          sucesso = true;
          break;
        }
      } catch (err) {
        ultimoErro = err.message;
      }
    }

    if (sucesso) break;
  }

  if (!sucesso) {
    alert("Não foi possível gerar a descrição no momento devido à alta demanda nos servidores do Google ou modelo indisponível. Detalhes: " + ultimoErro);
  }

  btn.disabled = false;
  btn.textContent = "✨ Gerar Descrição com IA";
}

// --- UTILITÁRIOS ---
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function copiarTexto(elId) {
  const el = document.getElementById(elId);
  if (!el.value) return;
  el.select();
  document.execCommand('copy');
  showToast("HTML copiado com sucesso!");
}
</script>
</body>
</html>
