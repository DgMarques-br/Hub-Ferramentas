<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formatador de Anúncios · Hub Operacional</title>
<link rel="icon" type="image/png" href="img/Logotipo.png">
<script>
  const storedTheme = localStorage.getItem('sapCatalogTheme');
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', storedTheme || (prefersDark ? 'dark' : 'light'));
  if(localStorage.getItem('hubReducedMotion') === 'true') document.documentElement.classList.add('reduced-motion');
</script>
<style>
  :root{
    --bg:#F7F6F3;--paper:#FFFFFF;--ink:#17211D;--ink-soft:#5F6B64;--line:#E8EBE9;--line-soft:#F0F2F1;
    --teal:#1F6F5C;--teal-dark:#164F42;--teal-wash:#E4F0EC;
    --amber:#C2610F;--amber-wash:#FDEFE3;
    --plum:#67549C;--plum-wash:#ECE8F5;
    --blue:#2563EB;--blue-wash:#EAF2FF;
    --rose:#E11D48;--rose-wash:#FFE4E6;
    --cyan:#0891B2;--cyan-wash:#E3F8FC;
    --red:#D93025;--red-wash:#FFE4E6;
    --radius:12px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Consolas,"Liberation Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:Georgia,"Iowan Old Style","Palatino Linotype","Book Antiqua",serif;
    --spring:cubic-bezier(0.34, 1.56, 0.64, 1);
    --bounce:cubic-bezier(0.68, -0.55, 0.265, 1.55);
    --glow1:rgba(244,162,97,.18);--glow2:rgba(73,196,161,.12);
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#0A0F0D;--paper:#101614;--ink:#E8EEEC;--ink-soft:#92A49C;--line:#1D2623;--line-soft:#161D1A;
    --teal:#49C4A1;--teal-dark:#8DE0C6;--teal-wash:#142E26;
    --amber:#EAA64B;--amber-wash:#332611;
    --plum:#B89EFA;--plum-wash:#281D40;
    --blue:#60A5FA;--blue-wash:#172554;
    --rose:#FB7185;--rose-wash:#3C121A;
    --cyan:#38BDF8;--cyan-wash:#082F49;
    --red:#FA7970;--red-wash:#3C121A;
    --glow1:rgba(234,166,75,.08);--glow2:rgba(73,196,161,.07);
    color-scheme:dark;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    position: relative;
    transition: background .4s ease, color .4s ease;
  }
  body::before {
    content: ""; position: fixed; inset: 0;
    background: radial-gradient(800px 400px at 90% -10%, var(--glow1), transparent 75%),
                radial-gradient(600px 300px at 15% 10%, var(--glow2), transparent 70%);
    z-index: -1; pointer-events: none;
  }
  button{ font-family: inherit; }
  :focus-visible{ outline: 2px solid var(--amber); outline-offset: 2px; }

  /* Scrollbar sutil apenas dentro dos painéis se a tela for muito baixa */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-soft); }

  @keyframes slideSpring{ from{ opacity:0; transform:translateY(16px) scale(0.98); } to{ opacity:1; transform:none; } }
  @keyframes fadeDown{ from{ opacity:0; transform:translateY(-12px); } to{ opacity:1; transform:none; } }
  .a-up{ animation: slideSpring 0.55s var(--spring) both; animation-delay: calc(var(--d,0)*1ms); }
  .a-down{ animation: fadeDown 0.45s var(--spring) both; }
  html.reduced-motion *, html.reduced-motion *::before, html.reduced-motion *::after { animation: none !important; transition: none !important; }

  /* ---------- Header Compacto ---------- */
  header.top{
    flex: 0 0 auto;
    background: color-mix(in srgb, var(--paper) 82%, transparent);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--line);
    z-index: 20;
  }
  .top-inner{
    max-width: 1240px; margin: 0 auto; padding: 12px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .header-left{ display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .nav-back {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12.5px; font-weight: 700; color: var(--ink-soft); text-decoration: none;
    padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg);
    transition: all 0.3s var(--spring);
  }
  .nav-back:hover { color: var(--amber); border-color: var(--amber); transform: translateX(-2px); }
  .title-block{ display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .brand-eyebrow{
    font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--amber); font-weight: 800; background: var(--amber-wash); padding: 3px 8px; border-radius: 6px;
  }
  h1{
    font-family: var(--serif); font-size: 22px; line-height: 1.1; margin: 0;
    letter-spacing: -.02em; font-weight: 800; color: var(--ink);
  }
  .subtitle{ margin: 0; color: var(--ink-soft); font-size: 12.5px; }

  .btn-sm{
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    padding: 7px 13px; border-radius: 10px; font-size: 12.5px; font-weight: 700;
    cursor: pointer; white-space: nowrap; transition: all 0.35s var(--spring);
  }
  .btn-sm svg{ width: 15px; height: 15px; stroke: currentColor; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .btn-sm:hover{ background: var(--line-soft); transform: translateY(-1px); border-color: var(--amber); }
  .btn-sm:active{ transform: scale(0.95); }

  /* ---------- Layout Grid (Viewport Locked) ---------- */
  main {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    max-width: 1240px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
  }
  .split-view {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  /* ---------- Cards ---------- */
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 20px;
    box-shadow: 0 8px 16px -8px rgba(0,0,0,0.05);
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }

  /* Cabeçalho interno do Formulário (Botão de Paginação no Canto Superior Direito) */
  .card-top-bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 12px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .step-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .step-dots { display: flex; gap: 5px; }
  .step-dot {
    width: 8px; height: 8px; border-radius: 99px; background: var(--line);
    transition: all 0.35s var(--spring); cursor: pointer;
  }
  .step-dot.active { width: 22px; background: var(--amber); }
  .step-label {
    font-family: var(--mono); font-size: 11px; font-weight: 800;
    text-transform: uppercase; letter-spacing: .1em; color: var(--ink-soft);
  }
  .btn-page-switch {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--amber-wash); color: var(--amber);
    border: 1px solid color-mix(in srgb, var(--amber) 35%, transparent);
    padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 800;
    cursor: pointer; transition: all 0.35s var(--spring);
  }
  .btn-page-switch:hover {
    background: var(--amber); color: #fff; transform: translateY(-1px) scale(1.02);
    box-shadow: 0 4px 10px color-mix(in srgb, var(--amber) 30%, transparent);
  }
  .btn-page-switch:active { transform: scale(0.95); }

  /* Carrossel / Transição das 2 Páginas */
  .pages-viewport {
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    position: relative;
  }
  .pages-track {
    display: flex;
    width: 200%;
    height: 100%;
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .pages-track.show-page-2 {
    transform: translateX(-50%);
  }
  .form-page {
    width: 50%;
    height: 100%;
    overflow-y: auto;
    padding-right: 4px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ---------- Campos Compactos ---------- */
  .form-group { margin: 0; display: flex; flex-direction: column; }
  .form-group.grow { flex: 1 1 auto; min-height: 75px; }
  .form-group label { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink); margin-bottom: 5px; }
  .form-group .hint { font-size: 11px; color: var(--ink-soft); margin-top: 4px; display: block; line-height: 1.3; }
  
  .row-inline {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: end;
  }
  .input-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

  input[type="text"], textarea {
    width: 100%; padding: 8px 11px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--bg); font-size: 13px; font-family: var(--sans); color: var(--ink);
    outline: none; transition: border-color .25s ease, background .25s ease, box-shadow .25s ease;
  }
  input[type="text"]::placeholder, textarea::placeholder { color: var(--ink-soft); opacity: 0.75; }
  input[type="text"]:focus, textarea:focus {
    border-color: var(--amber);
    background: var(--paper);
    box-shadow: 0 0 0 2.5px color-mix(in srgb, var(--amber) 15%, transparent);
  }
  textarea { resize: none; min-height: 76px; line-height: 1.4; }
  .form-group.grow textarea { flex: 1 1 auto; height: 100%; min-height: 82px; }

  /* Segmented Control */
  .segmented {
    display: inline-flex; gap: 3px; background: var(--bg); padding: 3px;
    border-radius: 999px; border: 1px solid var(--line); width: fit-content;
  }
  .seg-btn {
    border: none; background: transparent; padding: 5px 13px; border-radius: 999px;
    font-size: 12px; font-weight: 700; color: var(--ink-soft); cursor: pointer;
    transition: all .3s var(--spring);
  }
  .seg-btn:hover { color: var(--ink); }
  .seg-btn.active { background: var(--paper); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .seg-btn.active[data-val="novo"] { color: var(--teal); background: var(--teal-wash); }
  .seg-btn.active[data-val="recondicionado"] { color: var(--amber); background: var(--amber-wash); }

  /* Bloco Dinâmico de Dimensões */
  .dims-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
  .btn-add-dim {
    background: var(--amber-wash); color: var(--amber); border: 1px solid color-mix(in srgb, var(--amber) 35%, transparent);
    font-family: var(--mono); font-size: 10.5px; font-weight: 800; padding: 3px 9px;
    border-radius: 7px; cursor: pointer; transition: all 0.3s var(--bounce);
  }
  .btn-add-dim:hover { background: var(--amber); color: #fff; transform: scale(1.05); }
  
  .dim-bloco {
    background: var(--bg); border: 1px solid var(--line); padding: 10px 12px;
    border-radius: 10px; margin-bottom: 8px;
  }
  .dim-bloco:last-child { margin-bottom: 0; }
  .dim-bloco-topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .dim-bloco-titulo { font-family: var(--mono); font-size: 10.5px; font-weight: 800; color: var(--amber); text-transform: uppercase; letter-spacing: .08em; }
  .btn-remover-bloco {
    background: var(--red-wash); border: none; color: var(--red); font-size: 11px;
    font-weight: 700; cursor: pointer; padding: 2px 7px; border-radius: 5px;
  }

  /* Botões de Ação Fixos no Rodapé dos Cards */
  .actions {
    flex: 0 0 auto;
    display: flex; gap: 10px; margin-top: 12px; padding-top: 12px;
    border-top: 1px solid var(--line);
  }
  .btn-primary {
    flex: 1; padding: 9px 16px; font-size: 13px; background-color: var(--amber);
    color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: 800;
    transition: all 0.35s var(--spring); text-align: center;
    box-shadow: 0 4px 10px color-mix(in srgb, var(--amber) 25%, transparent);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 14px color-mix(in srgb, var(--amber) 35%, transparent); }
  .btn-primary:active { transform: scale(0.97); }
  .btn-secondary {
    padding: 9px 15px; font-size: 13px; background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-weight: 700;
    transition: all 0.35s var(--spring);
  }
  .btn-secondary:hover { background: var(--line-soft); border-color: var(--amber); }
  .btn-secondary:active { transform: scale(0.97); }

  /* ---------- Resultados (Coluna 2) ---------- */
  .tabs {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--line); margin-bottom: 12px; padding-bottom: 10px;
  }
  .tab-btn {
    background: var(--bg); border: 1px solid var(--line); padding: 6px 13px; border-radius: 999px;
    font-size: 12.5px; font-weight: 700; color: var(--ink-soft); cursor: pointer;
    transition: all 0.3s var(--spring);
  }
  .tab-btn:hover { color: var(--ink); border-color: var(--amber); }
  .tab-btn.active { color: var(--amber); border-color: var(--amber); background: var(--amber-wash); }

  .tab-content { display: none; flex: 1 1 auto; min-height: 0; }
  .tab-content.active { display: flex; flex-direction: column; }
  
  #htmlOutput {
    flex: 1 1 auto; height: 100%; font-family: var(--mono); font-size: 12px;
    line-height: 1.5; color: var(--ink); background: var(--bg); border-radius: 10px; padding: 12px;
  }
  
  .preview-box {
    flex: 1 1 auto; height: 100%; border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; background: var(--bg); overflow-y: auto;
    font-family: Arial, sans-serif; line-height: 1.45; font-size: 13px;
  }
  
  .aviso-validacao {
    display: none; margin-top: 8px; padding: 8px 12px; border-radius: 8px;
    background: var(--amber-wash); border: 1px solid var(--amber); color: var(--amber);
    font-size: 12px; font-weight: 700; flex: 0 0 auto;
  }

  /* Toast Notification */
  .toast{
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 10px;
    font-size: 12.5px; font-weight: 700; opacity: 0; pointer-events: none;
    box-shadow: 0 12px 24px -6px rgba(0,0,0,0.3);
    transition: opacity .2s ease, transform .35s var(--spring); z-index: 100;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Rodapé Ultra-Compacto */
  .footer-bar{ flex: 0 0 auto; max-width: 1240px; width: 100%; margin: 0 auto; padding: 0 24px; }
  .footer-inner{
    border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px;
    padding: 8px 0 10px; font-size: 11.5px; color: var(--ink-soft);
  }
  .footer-inner b{ color: var(--ink); font-weight: 700; }
  .vsep{ width: 1px; height: 12px; background: var(--line); }
  .footer-right{
    margin-left: auto; font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; display: flex; gap: 10px; align-items: center; font-weight: 700;
  }

  /* Responsivo Mobile */
  @media (max-width: 850px){
    body{ height: auto; overflow-y: auto; }
    main{ display: block; }
    .split-view{ grid-template-columns: 1fr; }
    .card{ min-height: 520px; }
    .subtitle{ display: none; }
    .row-inline{ grid-template-columns: 1fr; }
    .input-grid{ grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<header class="top a-down">
  <div class="top-inner">
    <div class="header-left">
      <a href="index.html" class="nav-back">← Hub</a>
      <div class="title-block">
        <span class="brand-eyebrow">Operacional</span>
        <h1>Formatador de Anúncios</h1>
        <span class="subtitle">· Padronização HTML para ERP, Linx, TikTok e Magalu</span>
      </div>
    </div>
    <div>
      <button class="btn-sm" id="themeToggle" type="button">🌙 Modo escuro</button>
    </div>
  </div>
</header>

<main>
  <div class="split-view">
    <!-- COLUNA 1: ENTRADA DE DADOS EM 2 PÁGINAS -->
    <div class="card a-up" style="--d:50">
      
      <!-- Barra Superior do Card com Botão de Troca de Página -->
      <div class="card-top-bar">
        <div class="step-indicator">
          <div class="step-dots">
            <span class="step-dot active" id="dotPage1" onclick="irParaPagina(1)" title="Página 1"></span>
            <span class="step-dot" id="dotPage2" onclick="irParaPagina(2)" title="Página 2"></span>
          </div>
          <span class="step-label" id="stepLabel">1/2 · Dados Principais</span>
        </div>
        <button type="button" class="btn-page-switch" id="btnSwitchPage" onclick="alternarPagina()">
          Complementos &amp; SKU →
        </button>
      </div>

      <!-- Viewport Deslizante -->
      <div class="pages-viewport">
        <div class="pages-track" id="pagesTrack">
          
          <!-- PÁGINA 1: TÍTULO, CONDIÇÃO, DESCRIÇÃO E ESPECIFICAÇÕES -->
          <div class="form-page" id="page1">
            <div class="row-inline">
              <div class="form-group">
                <label>Título do Produto</label>
                <input type="text" id="tituloOrig" placeholder="Ex: PLACA MÃE ASUS PRIME A520M-E AM4 MATX DDR4">
              </div>
              <div class="form-group">
                <label>Condição</label>
                <div class="segmented" id="condicaoSeg">
                  <button type="button" class="seg-btn active" data-val="novo">Novo</button>
                  <button type="button" class="seg-btn" data-val="recondicionado">Recond.</button>
                </div>
              </div>
            </div>

            <div class="form-group grow">
              <label>Descrição</label>
              <textarea id="descOrig" placeholder="Cole o texto descritivo e comercial do produto..."></textarea>
            </div>

            <div class="form-group grow">
              <label>Especificações <span style="font-weight:400; color:var(--ink-soft); font-size:11.5px;">("Chave: Valor" aplica negrito na chave)</span></label>
              <textarea id="specsOrig" placeholder="Marca: Asus&#10;Modelo: Prime A520M-E&#10;Chipset: AMD A520..."></textarea>
            </div>
          </div>

          <!-- PÁGINA 2: DIMENSÕES, ITENS INCLUSOS, GARANTIA E IDENTIFICAÇÃO -->
          <div class="form-page" id="page2">
            <!-- Dimensões Dinâmicas -->
            <div class="form-group">
              <div class="dims-header">
                <label style="margin-bottom:0;">Dimensões e Peso <span style="font-weight:400; color:var(--ink-soft);">(Opcional)</span></label>
                <button type="button" class="btn-add-dim" onclick="adicionarBlocoDimensao()">+ Item (Kit)</button>
              </div>
              
              <div id="containerDims">
                <div class="dim-bloco" data-index="0">
                  <div class="dim-bloco-topo" style="display:none;">
                    <span class="dim-bloco-titulo">Item 1</span>
                    <button type="button" class="btn-remover-bloco" onclick="removerBlocoDimensao(this)">Remover</button>
                  </div>
                  <div class="form-group" style="margin-bottom: 8px; display:none;">
                    <input type="text" class="dim-nome" placeholder="Nome do Item (Ex: Teclado, Mouse, Base...)">
                  </div>
                  <div class="input-grid">
                    <div><label style="font-size:11px; margin-bottom:3px;">Altura (cm)</label><input type="text" class="dim-altura" placeholder="Ex: 5"></div>
                    <div><label style="font-size:11px; margin-bottom:3px;">Compr. (cm)</label><input type="text" class="dim-comprimento" placeholder="Ex: 22"></div>
                    <div><label style="font-size:11px; margin-bottom:3px;">Largura (cm)</label><input type="text" class="dim-largura" placeholder="Ex: 22"></div>
                    <div><label style="font-size:11px; margin-bottom:3px;">Peso (kg/g)</label><input type="text" class="dim-peso" placeholder="Ex: 0,85"></div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Itens Inclusos -->
            <div class="form-group grow">
              <label>Itens Inclusos <span style="font-weight:400; color:var(--ink-soft); font-size:11.5px;">(Um por linha; marcadores removidos)</span></label>
              <textarea id="itensOrig" placeholder="1 Placa-mãe&#10;2 Cabos SATA&#10;Manual do usuário..."></textarea>
            </div>

            <!-- Garantia + EAN + Anatel -->
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;" id="garantiaWrap">
              <div class="form-group">
                <label>Garantia</label>
                <input type="text" id="garantiaOrig" placeholder="Ex: 1 ano" value="1 ano">
              </div>
              <div class="form-group">
                <label>Código EAN</label>
                <input type="text" id="eanOrig" placeholder="EAN">
              </div>
              <div class="form-group">
                <label>Anatel</label>
                <input type="text" id="anatelOrig" placeholder="Homologação">
              </div>
            </div>

            <!-- SKU / NAC -->
            <div class="form-group">
              <label>Identificação SKU</label>
              <input type="text" id="nacOrig" placeholder="Cole o SKU completo (Ex: NAC013738)">
              <span class="hint">Inserido diretamente sem adição automática de prefixo.</span>
            </div>
          </div>

        </div>
      </div>

      <div class="aviso-validacao" id="avisoValidacao"></div>

      <div class="actions">
        <button type="button" class="btn-primary" onclick="processarHTML()">Formatar Descrição</button>
        <button type="button" class="btn-secondary" onclick="limparCampos()">Limpar</button>
      </div>
    </div>

    <!-- COLUNA 2: RESULTADOS -->
    <div class="card a-up" style="--d:110">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('html')">&lt;/&gt; Código HTML</button>
        <button class="tab-btn" onclick="switchTab('preview')">👁️ Visualização Real</button>
      </div>

      <div id="tab-html" class="tab-content active">
        <textarea id="htmlOutput" readonly placeholder="O HTML formatado aparecerá aqui..."></textarea>
      </div>
      <div id="tab-preview" class="tab-content">
        <div class="preview-box" id="previewOutput">
          <span style="color: var(--ink-soft); font-size: 13px;">Nenhuma pré-visualização disponível.</span>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn-primary" onclick="copiarTexto('htmlOutput', 'HTML')">📋 Copiar HTML</button>
        <button type="button" class="btn-secondary" onclick="copiarRenderizado()">📝 Copiar Texto s/ HTML</button>
      </div>
    </div>
  </div>
</main>

<footer class="footer-bar">
  <div class="footer-inner">
    <b>Central de Ferramentas</b>
    <span class="vsep"></span>
    <span>Processamento local no navegador.</span>
    <div class="footer-right">
      <span>Uso interno</span>
      <span class="vsep"></span>
      <span>HTML</span>
    </div>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script>
// --- GESTÃO DE TEMA ---
const themeToggleBtn = document.getElementById('themeToggle');
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  const isDark = theme === 'dark';
  themeToggleBtn.innerHTML = isDark
    ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Modo claro'
    : '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Modo escuro';
}
applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
themeToggleBtn.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  localStorage.setItem('sapCatalogTheme', next);
});

// --- NAVEGAÇÃO ENTRE PÁGINAS DO FORMULÁRIO ---
let paginaAtual = 1;

function irParaPagina(num) {
  paginaAtual = num;
  const track = document.getElementById('pagesTrack');
  const btn = document.getElementById('btnSwitchPage');
  const label = document.getElementById('stepLabel');
  const dot1 = document.getElementById('dotPage1');
  const dot2 = document.getElementById('dotPage2');

  if (paginaAtual === 2) {
    track.classList.add('show-page-2');
    btn.textContent = '← Dados Principais';
    label.textContent = '2/2 · Complementos & SKU';
    dot1.classList.remove('active');
    dot2.classList.add('active');
  } else {
    track.classList.remove('show-page-2');
    btn.textContent = 'Complementos & SKU →';
    label.textContent = '1/2 · Dados Principais';
    dot2.classList.remove('active');
    dot1.classList.add('active');
  }
}

function alternarPagina() {
  irParaPagina(paginaAtual === 1 ? 2 : 1);
}

// --- GESTÃO DE UI ---
let condicaoAtual = 'novo';

document.getElementById('condicaoSeg').addEventListener('click', (e) => {
  const btn = e.target.closest('.seg-btn');
  if(!btn) return;
  document.querySelectorAll('#condicaoSeg .seg-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  condicaoAtual = btn.getAttribute('data-val');
  
  const garInput = document.getElementById('garantiaOrig');
  if(condicaoAtual === 'recondicionado') {
    garInput.style.opacity = '0.5';
    garInput.disabled = true;
  } else {
    garInput.style.opacity = '1';
    garInput.disabled = false;
  }
});

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  
  if(tab === 'html') {
    document.querySelectorAll('.tab-btn')[0].classList.add('active');
    document.getElementById('tab-html').classList.add('active');
  } else {
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
    document.getElementById('tab-preview').classList.add('active');
  }
}

// --- GESTÃO DE BLOCOS DINÂMICOS DE DIMENSÕES ---
function adicionarBlocoDimensao() {
  const container = document.getElementById('containerDims');
  const blocos = container.querySelectorAll('.dim-bloco');
  const novoIndice = blocos.length + 1;

  const div = document.createElement('div');
  div.className = 'dim-bloco';
  div.setAttribute('data-index', novoIndice);
  div.innerHTML = `
    <div class="dim-bloco-topo">
      <span class="dim-bloco-titulo">Item ${novoIndice}</span>
      <button type="button" class="btn-remover-bloco" onclick="removerBlocoDimensao(this)">Remover</button>
    </div>
    <div class="form-group" style="margin-bottom: 8px;">
      <input type="text" class="dim-nome" placeholder="Nome do Item (Ex: Teclado, Mouse, Receptor...)">
    </div>
    <div class="input-grid">
      <div><label style="font-size:11px; margin-bottom:3px;">Altura (cm)</label><input type="text" class="dim-altura" placeholder="Ex: 5"></div>
      <div><label style="font-size:11px; margin-bottom:3px;">Compr. (cm)</label><input type="text" class="dim-comprimento" placeholder="Ex: 22"></div>
      <div><label style="font-size:11px; margin-bottom:3px;">Largura (cm)</label><input type="text" class="dim-largura" placeholder="Ex: 22"></div>
      <div><label style="font-size:11px; margin-bottom:3px;">Peso (kg/g)</label><input type="text" class="dim-peso" placeholder="Ex: 0,85"></div>
    </div>
  `;
  container.appendChild(div);
  atualizarVisibilidadeBlocosDims();
}

function removerBlocoDimensao(btn) {
  const bloco = btn.closest('.dim-bloco');
  bloco.remove();
  
  const container = document.getElementById('containerDims');
  const blocos = container.querySelectorAll('.dim-bloco');
  blocos.forEach((b, idx) => {
    b.setAttribute('data-index', idx + 1);
    const titulo = b.querySelector('.dim-bloco-titulo');
    if(titulo) titulo.textContent = `Item ${idx + 1}`;
  });

  atualizarVisibilidadeBlocosDims();
}

function atualizarVisibilidadeBlocosDims() {
  const container = document.getElementById('containerDims');
  const blocos = container.querySelectorAll('.dim-bloco');
  
  blocos.forEach((b) => {
    const topo = b.querySelector('.dim-bloco-topo');
    const inputNome = b.querySelector('.dim-nome').closest('.form-group');
    
    if (blocos.length === 1) {
      if(topo) topo.style.display = 'none';
      if(inputNome) inputNome.style.display = 'none';
    } else {
      if(topo) topo.style.display = 'flex';
      if(inputNome) inputNome.style.display = 'block';
    }
  });
}

// --- LÓGICA DE FORMATAÇÃO ---
function formatarTituloCase(texto) {
  const excecoes = ['e', 'de', 'da', 'do', 'das', 'dos', 'a', 'o', 'em', 'para', 'com'];
  const pular = ['USB', 'HDMI', 'SSD', 'NVME', 'DDR4', 'DDR5', 'WIFI', 'WI-FI', 'PC', 'MATX', 'ATX', 'AM4', 'AM5', 'RGB', 'LED'];
  
  return texto.toLowerCase().split(' ').map((palavra, index) => {
    if (pular.includes(palavra.toUpperCase())) return palavra.toUpperCase();
    if (index !== 0 && excecoes.includes(palavra)) return palavra;
    return palavra.charAt(0).toUpperCase() + palavra.slice(1);
  }).join(' ');
}

function processarHTML() {
  const tituloEl = document.getElementById('tituloOrig');
  const tituloInput = tituloEl.value.trim();
  const descInput = document.getElementById('descOrig').value;
  const specsInput = document.getElementById('specsOrig').value;
  const itensInput = document.getElementById('itensOrig').value;
  const garantiaInput = document.getElementById('garantiaOrig').value.trim();
  const eanInput = document.getElementById('eanOrig').value.trim();
  const anatelInput = document.getElementById('anatelOrig').value.trim();
  const nacInput = document.getElementById('nacOrig').value.trim();
  const aviso = document.getElementById('avisoValidacao');

  if(!tituloInput) {
    irParaPagina(1);
    tituloEl.focus();
    aviso.textContent = "⚠️ O Título do produto é obrigatório.";
    aviso.style.display = 'block';
    return;
  }
  aviso.style.display = 'none';

  // 1. Título
  let tituloFormatado = formatarTituloCase(tituloInput);
  if (condicaoAtual === 'recondicionado') {
    tituloFormatado += " - Recondicionado";
  }

  // 2. Processar Blocos de Texto
  let blocoDescricao = descInput.split('\n').map(l => l.trim()).filter(l => l !== '');
  let blocoSpecs = specsInput.split('\n').map(l => l.trim()).filter(l => l !== '');
  
  let blocoItens = itensInput.split('\n')
    .map(l => l.replace(/^[-*•]\s*/, '').trim())
    .filter(l => l !== '');

  // 3. Processar Dimensões Dinâmicas
  const blocosDimsDOM = document.querySelectorAll('.dim-bloco');
  let dadosDimensoes = [];
  
  blocosDimsDOM.forEach(bloco => {
    let nomeItem = bloco.querySelector('.dim-nome').value.trim();
    let altura = bloco.querySelector('.dim-altura').value.trim();
    let largura = bloco.querySelector('.dim-largura').value.trim();
    let comprimento = bloco.querySelector('.dim-comprimento').value.trim();
    let peso = bloco.querySelector('.dim-peso').value.trim();

    if(altura || largura || comprimento || peso || nomeItem) {
      dadosDimensoes.push({
        nome: nomeItem,
        altura: altura ? altura.replace(/cm/i, '').trim() + ' cm' : null,
        largura: largura ? largura.replace(/cm/i, '').trim() + ' cm' : null,
        comprimento: comprimento ? comprimento.replace(/cm/i, '').trim() + ' cm' : null,
        peso: peso ? peso.replace(/kg|g/i, '').trim() + (peso.toLowerCase().includes('g') && !peso.toLowerCase().includes('kg') ? ' g' : ' kg') : null
      });
    }
  });

  // --- MONTAGEM DO HTML ---
  let html = `<span style="font-size:14px;"><strong>${tituloFormatado}</strong></span><br><br>\n`;
  
  // Bloco Descrição
  html += `<span style="font-size:12px;">\n`;
  if(blocoDescricao.length > 0) {
    html += blocoDescricao.join('<br>\n') + `<br>\n`;
  } else {
    html += `(Descrição não fornecida)<br>\n`;
  }
  html += `</span><br>\n`;

  // Bloco Especificações
  html += `<span style="font-size:14px;"><strong>ESPECIFICAÇÕES</strong></span><br><br>\n`;
  html += `<span style="font-size:12px;">\n`;
  if(blocoSpecs.length > 0) {
    blocoSpecs.forEach(spec => {
      if(spec.includes(':')) {
        const parts = spec.split(':');
        const chave = parts.shift().trim();
        const valor = parts.join(':').trim();
        html += `<strong>${chave}:</strong> ${valor}<br>\n`;
      } else {
        html += `${spec}<br>\n`;
      }
    });
  } else {
    html += `(Especificações não fornecidas)<br>\n`;
  }
  html += `</span><br>\n`;

  // Bloco Dimensões Dinâmicas
  if(dadosDimensoes.length > 0) {
    html += `<span style="font-size:12px;"><strong>DIMENSÕES E PESO</strong></span><br>\n`;
    html += `<span style="font-size:12px;">\n`;
    
    const multiplos = dadosDimensoes.length > 1 || dadosDimensoes[0].nome !== "";
    
    dadosDimensoes.forEach(d => {
      let prefixo = multiplos && d.nome ? `<strong>${d.nome}</strong> - ` : "";
      
      if(d.altura) html += `${prefixo}<strong>Altura:</strong> ${d.altura}<br>\n`;
      if(d.largura) html += `${prefixo}<strong>Largura:</strong> ${d.largura}<br>\n`;
      if(d.comprimento) html += `${prefixo}<strong>Comprimento:</strong> ${d.comprimento}<br>\n`;
      if(d.peso) html += `${prefixo}<strong>Peso:</strong> ${d.peso}<br>\n`;
    });
    html += `</span><br>\n`;
  }

  // Bloco Itens Inclusos
  html += `<span style="font-size:12px;"><strong>ITENS INCLUSOS</strong></span><br>\n`;
  html += `<span style="font-size:12px;">\n`;
  if(blocoItens.length > 0) {
    blocoItens.forEach(item => {
      html += `${item}<br>\n`;
    });
  } else {
    html += `O produto e seus acessórios padrão de fábrica.<br>\n`;
  }
  html += `</span><br>\n`;

  // Bloco Rodapé
  html += `<span style="font-size:12px;">\n`;
  if (condicaoAtual === 'recondicionado') {
    html += `<strong>ATENÇÃO - PRODUTO RECONDICIONADO</strong><br>\n`;
    html += `Produto recondicionado com garantia de 3 meses. Todos os itens passam por testes rigorosos de funcionamento. As embalagens podem apresentar avarias, sem impacto no funcionamento do produto.<br>\n`;
  } else {
    const gar = garantiaInput ? garantiaInput : "prazo confirmado";
    html += `Imagens de caráter ilustrativo.<br>\n`;
    html += `Informações divulgadas de acordo com o manual do fabricante.<br>\n`;
    html += `Produto novo na caixa, lacrado com NF e garantia do fabricante de ${gar}.<br>\n`;
    html += `Em caso de dúvidas sobre informações técnicas, utilização, limitações e manuseio do produto, verifique o manual do fabricante.<br>\n`;
  }
  
  // Identificação (EAN, Anatel e SKU sem prefixo forçado)
  if (eanInput || anatelInput || nacInput) {
    html += `<br>\n`; 
    if (eanInput) html += `<strong>EAN:</strong> ${eanInput}<br>\n`;
    if (anatelInput) html += `<strong>ANATEL:</strong> ${anatelInput}<br>\n`;
    if (nacInput) html += `<strong>${nacInput}</strong><br>\n`;
  }

  html += `</span>`;

  // Saída
  document.getElementById('htmlOutput').value = html;
  document.getElementById('previewOutput').innerHTML = html;
}

// --- FUNÇÕES UTILITÁRIAS ---
function limparCampos() {
  document.getElementById('tituloOrig').value = '';
  document.getElementById('descOrig').value = '';
  document.getElementById('specsOrig').value = '';
  document.getElementById('containerDims').innerHTML = `
    <div class="dim-bloco" data-index="0">
      <div class="dim-bloco-topo" style="display:none;">
        <span class="dim-bloco-titulo">Item 1</span>
        <button type="button" class="btn-remover-bloco" onclick="removerBlocoDimensao(this)">Remover</button>
      </div>
      <div class="form-group" style="margin-bottom: 8px; display:none;">
        <input type="text" class="dim-nome" placeholder="Nome do Item (Ex: Teclado, Mouse, Base...)">
      </div>
      <div class="input-grid">
        <div><label style="font-size:11px; margin-bottom:3px;">Altura (cm)</label><input type="text" class="dim-altura" placeholder="Ex: 5"></div>
        <div><label style="font-size:11px; margin-bottom:3px;">Compr. (cm)</label><input type="text" class="dim-comprimento" placeholder="Ex: 22"></div>
        <div><label style="font-size:11px; margin-bottom:3px;">Largura (cm)</label><input type="text" class="dim-largura" placeholder="Ex: 22"></div>
        <div><label style="font-size:11px; margin-bottom:3px;">Peso (kg/g)</label><input type="text" class="dim-peso" placeholder="Ex: 0,85"></div>
      </div>
    </div>
  `;
  document.getElementById('itensOrig').value = '';
  document.getElementById('garantiaOrig').value = '1 ano';
  document.getElementById('eanOrig').value = '';
  document.getElementById('anatelOrig').value = '';
  document.getElementById('nacOrig').value = '';
  document.getElementById('htmlOutput').value = '';
  document.getElementById('previewOutput').innerHTML = '<span style="color: var(--ink-soft); font-size: 13px;">Nenhuma pré-visualização disponível.</span>';
  document.getElementById('avisoValidacao').style.display = 'none';
  condicaoAtual = 'novo';
  document.querySelectorAll('#condicaoSeg .seg-btn')[0].click();
  irParaPagina(1);
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

function copiarTexto(elementId, label) {
  const el = document.getElementById(elementId);
  if(!el.value) {
    showToast('Nenhum conteúdo para copiar.');
    return;
  }
  el.select();
  document.execCommand('copy');
  showToast(label + ' copiado para a área de transferência!');
}

function copiarRenderizado() {
  const prev = document.getElementById('previewOutput');
  if(!prev.innerText.trim() || prev.innerText.includes('Nenhuma pré-visualização')) {
    showToast('Nenhum conteúdo para copiar.');
    return;
  }
  
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(prev.innerText).then(() => {
      showToast('Texto simples copiado!');
    });
  } else {
    const ta = document.createElement('textarea');
    ta.value = prev.innerText;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('Texto simples copiado!');
  }
}
</script>
